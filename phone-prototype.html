<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111820">
  <meta name="application-version" content="2.0.0">
  <title>模拟器</title>
  <link rel="stylesheet" href="phone.css?v=2.0.0-20260818h">
</head>
<body class="ios-ui">
  <main class="sim-stage" aria-label="PolyU 学生生活模拟器">
    <div class="stage-copy" aria-hidden="true">
      <span class="stage-kicker">POLYU · STUDENT DAY</span>
      <strong id="stageTitle">模拟器</strong>
      <p id="stageTagline">完成今天的事。相信谁，由你判断。</p>
    </div>

    <aside class="timeline-controller" id="timelineController" aria-label="模拟时间控制">
      <header class="timeline-controller-head">
        <span id="timelineLabel">SIM TIME</span>
        <strong id="timelineTime">08:30</strong>
      </header>
      <div class="timeline-controls" role="group" aria-label="时间速度">
        <button type="button" data-action="timeline-speed" data-speed="0" aria-label="暂停时间" aria-pressed="true">Ⅱ</button>
        <button type="button" data-action="timeline-speed" data-speed="1" aria-label="一倍速" aria-pressed="false">1×</button>
        <button type="button" data-action="timeline-speed" data-speed="2" aria-label="二倍速" aria-pressed="false">2×</button>
        <button type="button" data-action="timeline-speed" data-speed="4" aria-label="四倍速" aria-pressed="false">4×</button>
        <button class="timeline-next" type="button" data-action="timeline-next" aria-label="跳到下一事件">
          <span aria-hidden="true">↠</span><b id="timelineNextLabel">下一事件</b>
        </button>
      </div>
      <p id="timelineStatus" role="status" aria-live="polite">时间已暂停</p>
    </aside>

    <section class="phone-shell" id="simulator">
      <div class="phone-bezel">
        <div class="phone-status" aria-label="手机状态栏">
          <span id="statusTime">08:30</span>
          <span class="status-island" aria-hidden="true"></span>
          <span class="status-icons">
            <span class="status-signal" aria-hidden="true">
              <svg viewBox="0 0 20 14"><path d="M2 11.5h2.5V13H2zm4-3h2.5V13H6zm4-3h2.5V13H10zm4-3h2.5V13H14z"/></svg>
              <svg viewBox="0 0 20 14"><path d="M2 5.5a12 12 0 0 1 16 0M5 8.5a7.5 7.5 0 0 1 10 0M8.2 11.2a2.7 2.7 0 0 1 3.6 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="10" cy="12" r="1"/></svg>
              <span class="battery"><span></span></span>
            </span>
          </span>
        </div>

        <div class="phone-viewport" id="phoneViewport">
          <section class="phone-screen lock-screen is-active" id="lockScreen" aria-labelledby="lockTitle">
            <div class="wallpaper-grid" aria-hidden="true"></div>
            <div class="simulation-pill" id="simulationPill">教学模拟 · 不使用真实账户</div>
            <div class="lock-clock">
              <span id="lockDate">8月11日 星期二</span>
              <strong id="lockTime">08:30</strong>
            </div>
            <div class="lock-brief">
              <span id="lockBriefLabel">今天</span>
              <strong id="lockBriefTitle">两件事需要处理</strong>
            </div>
            <div class="lock-notifications" id="lockNotifications"></div>
            <button class="unlock-button" id="unlockButton" type="button">
              <span id="unlockLabel">点按进入</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 14 5-5 5 5"/></svg>
            </button>
          </section>

          <section class="phone-screen home-screen" id="homeScreen" aria-label="手机主屏幕">
            <div class="wallpaper-grid" aria-hidden="true"></div>
            <header class="home-header">
              <div>
                <span id="homeDate">8月11日 · 星期二</span>
                <strong id="homeTitle">模拟器</strong>
              </div>
              <button class="avatar-button" id="openTasksShortcut" type="button" aria-label="打开今日任务">CY</button>
            </header>

            <section class="todo-widget" id="todayCard" role="button" tabindex="0" aria-label="打开今日任务">
              <header class="todo-widget-head">
                <div><span class="today-card-label" id="todayLabel">TODAY</span><strong id="todayTitle">今日待办</strong></div>
                <span id="todayProgress">0 / 2</span>
              </header>
              <div class="home-todo-list" id="homeTodoList"></div>
              <i class="todo-progress"><span id="todayProgressBar"></span></i>
            </section>

            <div class="app-grid" id="appGrid"></div>
            <div class="home-page-dot" aria-hidden="true"><span></span></div>
            <div class="dock" id="appDock"></div>
          </section>

          <section class="phone-screen app-screen" id="appScreen">
            <header class="app-header">
              <button class="app-back" id="appBack" type="button" aria-label="返回主屏幕">
                <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
              </button>
              <div>
                <span id="appEyebrow">APP</span>
                <strong id="appTitle" role="heading" aria-level="1">应用</strong>
              </div>
              <button class="app-more" id="appMore" type="button" aria-label="更多选项">•••</button>
            </header>
            <div class="app-content" id="appContent"></div>
          </section>

          <div class="toast" id="toast" role="status" aria-live="polite"></div>
          <div class="overlay-layer" id="overlayLayer" aria-live="assertive"></div>
          <aside class="active-call-bar" id="activeCallBar" hidden aria-label="进行中的通话"></aside>
        </div>

        <nav class="system-navigation is-hidden" id="systemNavigation" aria-label="系统导航">
          <button class="system-nav-button system-back" id="systemBack" type="button" aria-label="返回上一页" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 5-7 7 7 7"/></svg>
            <span id="systemBackLabel">返回</span>
          </button>
          <button class="system-nav-button system-home" id="systemHome" type="button" aria-label="返回主屏幕" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20H4z"/><path d="M9.5 20v-6h5v6"/></svg>
            <span id="systemHomeLabel">主页</span>
          </button>
        </nav>
      </div>
    </section>

    <aside class="stage-note" aria-hidden="true">
      <span>08:30—17:30</span>
      <p><span id="stageNoteLine1">通知不等于事实。</span><br><span id="stageNoteLine2">从你信任的入口重新开始。</span></p>
    </aside>
  </main>

  <script src="phone-data.js?v=2.0.0-20260818h"></script>
  <script src="phone-engine.js?v=2.0.0-20260818h"></script>
</body>
</html>
